# 프로필 README 카드(통계 · 연속 기여)를 매일 새로 그려 profile/ 폴더에 저장한다.
# 비공개 저장소 기여까지 세려면 저장소 Secrets 에 PROFILE_CARDS_TOKEN(classic PAT: repo, read:user)이 있어야 한다.
name: Update profile cards

on:
  schedule:
    - cron: "0 18 * * *"   # 매일 03:00 (한국 시간)
  workflow_dispatch:        # Actions 탭에서 직접 실행
  push:
    paths:
      - ".github/workflows/profile-cards.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: GitHub 통계 카드
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&hide_border=true&custom_title=GitHub%20Stats&bg_color=00000000&title_color=58A6FF&icon_color=58A6FF&text_color=8B949E
          path: profile/stats.svg
          token: ${{ secrets.PROFILE_CARDS_TOKEN }}

      - name: 연속 기여 카드
        uses: DenverCoder1/github-readme-streak-stats@v1
        with:
          options: user=${{ github.repository_owner }}&hide_border=true&disable_animations=true&background=00000000&ring=58A6FF&fire=58A6FF&currStreakNum=58A6FF&sideNums=58A6FF&currStreakLabel=58A6FF&sideLabels=8B949E&dates=8B949E&stroke=8B949E
          path: profile/streak.svg
          token: ${{ secrets.PROFILE_CARDS_TOKEN }}

      - name: 카드 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update profile cards" || exit 0
          git push
